<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ELEKTROTeam{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="{{ url_for('home') }}"><span>ELEKTRO</span><strong>Team</strong></a>

      <nav class="nav" aria-label="Main">
        <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ url_for('catalog') }}" {% if request.endpoint in ('catalog', 'product') %}aria-current="page"{% endif %}>Shop</a>
        <a href="{{ url_for('admin') }}" {% if request.endpoint == 'admin' %}aria-current="page"{% endif %}>Admin</a>
      </nav>

      <div class="header-icons">
        <a class="icon-btn" href="{{ url_for('catalog') }}#search" aria-label="Search products">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5.5 5.5"/>
          </svg>
        </a>
      </div>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
